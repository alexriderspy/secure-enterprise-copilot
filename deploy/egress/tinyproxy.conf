# The only way out of the private network. Everything not in the allowlist is refused.
Port 8888
Listen 0.0.0.0
Timeout 120
LogLevel Connect
MaxClients 50
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 10.0.0.0/8
DisableViaHeader Yes
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
ConnectPort 443
