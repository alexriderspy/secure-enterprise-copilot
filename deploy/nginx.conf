# The front door: the app on 8080, Keycloak's login pages on 8081. Nothing else is exposed.
events {}
http {
  server_tokens off;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  resolver 127.0.0.11 valid=10s;   # Docker's DNS: look services up per request, so start order doesn't matter
  server {
    listen 8080;
    location / {
      set $app http://app:8000;
      proxy_pass $app;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 180s;
    }
  }
  server {
    listen 8081;
    location / {
      set $keycloak http://keycloak:8080;
      proxy_pass $keycloak;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
    }
  }
}
