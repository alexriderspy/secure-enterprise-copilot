# Private deployment. Only the gateway and the egress proxy touch the outside world:
#   edge network     -> gateway (the two ports you open in a browser) + egress proxy
#   private network  -> app, Keycloak: no route out except through the egress allowlist
name: secure-enterprise-copilot

services:
  gateway:
    image: nginx:1.27-alpine
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
      - "127.0.0.1:${KEYCLOAK_PORT}:8081"
    networks: [edge, private]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}   # the address browsers see
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"          # the app talks to it as http://keycloak:8080
      KC_PROXY_HEADERS: xforwarded
    mem_limit: 1g
    networks: [private]

  app:
    build: {context: ., dockerfile: deploy/Dockerfile}
    environment:
      KB_DB: /data/kb.db
      EMBED_MODEL: /models/bge-small-en-v1.5
      APP_URL: http://localhost:${APP_PORT}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/vardhan
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/vardhan/.well-known/openid-configuration
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL}
      LLM_PRIMARY_API_KEY_FILE: /run/secrets/llm_primary_api_key
      LLM_FALLBACK_BASE_URL: http://host.docker.internal:11434/v1   # Ollama on the host
      LLM_FALLBACK_MODEL: qwen2.5:7b
      HTTP_PROXY: http://egress:8888
      HTTPS_PROXY: http://egress:8888
      NO_PROXY: keycloak,localhost,127.0.0.1
    secrets: [oidc_client_secret, llm_primary_api_key]
    volumes:
      - kbdata:/data
      - ./models/bge-small-en-v1.5:/models/bge-small-en-v1.5:ro   # from deploy/fetch_model.py
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1500m
    networks: [private]

  egress:
    build: deploy/egress
    networks: [edge, private]

networks:
  edge: {}
  private: {internal: true}   # Docker gives this network no route to the internet

volumes:
  kbdata: {}

secrets:
  oidc_client_secret: {file: ./secrets/oidc_client_secret}
  llm_primary_api_key: {file: ./secrets/llm_primary_api_key}
